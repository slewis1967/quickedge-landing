<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Quick Edge AI favicon">
  <defs>
    <linearGradient id="qeaigrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a4df0"/>
      <stop offset="100%" stop-color="#6ea7ff"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="rgba(13,15,19,0.18)"/>
    </filter>
  </defs>
  <!-- Diamond (rotated square) as brand mark -->
  <polygon points="256,56 456,256 256,456 56,256" fill="url(#qeaigrad)" filter="url(#softShadow)"/>
  <!-- Small inner diamond for subtle contrast -->
  <polygon points="256,156 356,256 256,356 156,256" fill="#ffffff" opacity="0.9"/>
</svg>

