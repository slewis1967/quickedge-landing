<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 160" role="img" aria-label="Quick Edge AI logo">
  <defs>
    <linearGradient id="qg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a4df0"/>
      <stop offset="100%" stop-color="#6ee7ff"/>
    </linearGradient>
    <linearGradient id="tail" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#49a9ff"/>
      <stop offset="100%" stop-color="#67f2e5"/>
    </linearGradient>
    <mask id="cut">
      <rect width="720" height="160" fill="#fff"/>
      <path d="M70 118 L98 90 L122 114 L94 142 Z" fill="#000"/>
    </mask>
  </defs>
  <!-- Q mark -->
  <g transform="translate(20,8)">
    <circle cx="92" cy="68" r="58" fill="none" stroke="url(#qg)" stroke-width="26" stroke-linecap="round" mask="url(#cut)"/>
    <path d="M64 116 L100 94 L120 150 L84 130 L52 134 Z" fill="url(#tail)"/>
  </g>
  <!-- wordmark (uses installed fonts; close match to PNG) -->
  <g style="font: 700 44px/1.05 Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" transform="translate(190,104)">
    <text x="0" y="0" fill="#0d0f13">Quick Edge </text>
    <text x="286" y="0" fill="url(#qg)">AI</text>
  </g>
</svg>
